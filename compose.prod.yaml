# Active automatically when APP_ENV is "uat" or "production"
services:
  postgres:
    mem_limit: 512m
    shm_size: 128m
    restart: unless-stopped

  migrate:
    image: ecom-rental-backend:${APP_ENV:-production}
    build:
      context: .
      target: production
      args:
        APP_ENV: ${APP_ENV:-production}
    environment:
      APP_ENV: ${APP_ENV:-production}
    entrypoint: ["/app/migrate"]
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m

  api:
    image: ecom-rental-backend:${APP_ENV:-production}
    build:
      context: .
      target: production
      args:
        APP_ENV: ${APP_ENV:-production}
    environment:
      APP_ENV: ${APP_ENV:-production}
    entrypoint: ["/app/api"]
    read_only: true
    tmpfs:
      - /tmp:size=32M,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    restart: unless-stopped

  worker:
    image: ecom-rental-backend:${APP_ENV:-production}
    build:
      context: .
      target: production
      args:
        APP_ENV: ${APP_ENV:-production}
    environment:
      APP_ENV: ${APP_ENV:-production}
    entrypoint: ["/app/worker"]
    healthcheck:
      disable: true
    read_only: true
    tmpfs:
      - /tmp:size=32M,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    restart: unless-stopped
