version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/platform/db/queries"
    schema: "migrations"
    gen:
      go:
        package: "dbsqlc"
        out: "internal/platform/db/dbsqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "NullUUID"
