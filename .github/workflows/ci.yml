name: CI, Auto-Deploy Dev & Sync UAT

on:
  push:
    branches-ignore:
      - uat
      - main
  pull_request:
    branches:
      - dev
      - uat

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Vulncheck, Test & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint v2 & govulncheck
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.15.0
          go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run golangci-lint
        run: golangci-lint run ./...

      - name: Run govulncheck
        run: govulncheck ./...

      - name: Run Go tests
        run: go test -v ./...

      - name: Test compiled static binaries
        env:
          CGO_ENABLED: "0"
          APP_ENV: dev
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/api ./cmd/api
          go build -trimpath -ldflags="-s -w" -o dist/worker ./cmd/worker
          go build -trimpath -ldflags="-s -w" -o dist/migrate ./cmd/migrate

  deploy-dev:
    name: Auto-Deploy Dev Server
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: self-hosted
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: deploy-dev-backend
      cancel-in-progress: false
    env:
      DEV_PUBLIC_URL: https://api-dev-rental-cloth.sutiphonglabs.com
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Register GitHub Deployment (dev - In Progress)
        id: gh_deploy
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            $headers = @{
              'Authorization'        = "Bearer $env:GH_TOKEN"
              'Accept'               = 'application/vnd.github+json'
              'X-GitHub-Api-Version' = '2022-11-28'
              'User-Agent'           = 'GitHub-Actions-Dev-Deploy'
            }
            $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            $createBody = @{
              ref                    = 'dev'
              environment            = 'dev'
              auto_merge             = $false
              required_contexts      = @()
              production_environment = $false
              description            = 'Auto-Deploy Dev Backend'
            } | ConvertTo-Json

            $dep = Invoke-RestMethod -Method Post `
              -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/deployments" `
              -Headers $headers -Body $createBody -ContentType 'application/json'

            "deployment_id=$($dep.id)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

            $statusBody = @{
              state       = 'in_progress'
              log_url     = $runUrl
              environment = 'dev'
              description = 'Building and restarting Dev Backend Docker containers...'
            } | ConvertTo-Json

            Invoke-RestMethod -Method Post `
              -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/deployments/$($dep.id)/statuses" `
              -Headers $headers -Body $statusBody -ContentType 'application/json' | Out-Null
          } catch {
            Write-Warning "Could not register GitHub Deployment API entry: $($_.Exception.Message)"
          }

      - name: Pull latest dev branch and redeploy Dev Docker stack
        shell: powershell
        env:
          DEV_DIR: ${{ vars.DEV_BACKEND_DIR || 'C:\Users\sutip\.gemini\antigravity\scratch\e-com-rental-cloth-dev\backend' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $startedAt = Get-Date
          $env:Path = "$env:LOCALAPPDATA\Programs\go\bin;$env:USERPROFILE\go\bin;$env:LOCALAPPDATA\Programs\bin;" + $env:Path

          docker info >$null 2>&1
          if ($LASTEXITCODE -ne 0) {
            $ddExe = "$env:LOCALAPPDATA\Programs\DockerDesktop\Docker Desktop.exe"
            if (-not (Test-Path $ddExe)) {
              $ddExe = 'C:\Program Files\Docker\Docker\Docker Desktop.exe'
            }
            if (Test-Path $ddExe) {
              Write-Output "Starting Docker Desktop via WMI..."
              Invoke-CimMethod -ClassName Win32_Process -MethodName Create -Arguments @{ CommandLine = "`"$ddExe`"" } | Out-Null
              for ($i = 1; $i -le 40; $i++) {
                Start-Sleep -Seconds 3
                docker info >$null 2>&1
                if ($LASTEXITCODE -eq 0) { break }
              }
            }
          }
          docker info --format 'Docker Engine: {{.ServerVersion}}'
          if ($LASTEXITCODE -ne 0) { throw "Docker Engine is not reachable." }

          if (-not (Test-Path $env:DEV_DIR)) {
            throw "Dev Server directory not found: $env:DEV_DIR"
          }
          Set-Location $env:DEV_DIR
          git fetch origin dev
          git checkout dev
          git reset --hard origin/dev

          $commitSha = (git rev-parse --short HEAD).Trim()
          $commitMsg = ((git log -1 --pretty=%s) -replace '\|', '/').Trim()
          $commitAuthor = ((git log -1 --pretty=%an) -replace '\|', '/').Trim()
          Write-Output "Synced Dev Backend to commit: $commitSha - $commitMsg"

          go run ./scripts/docker.go up -d --build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $healthy = $false
          for ($attempt = 1; $attempt -le 20; $attempt++) {
            try {
              $res = Invoke-WebRequest -Uri 'http://127.0.0.1:8050/api/v1/health' -UseBasicParsing -TimeoutSec 5
              if ($res.StatusCode -eq 200) {
                Write-Output "Dev Healthcheck passed on attempt $attempt : $($res.Content.Trim())"
                $healthy = $true
                break
              }
            } catch {
              Start-Sleep -Seconds 2
            }
          }
          if (-not $healthy) {
            throw "Dev Backend failed post-deploy healthcheck on port 8050."
          }

          docker image prune -f | Out-Null

          $bt = [char]96
          $durationSec = [math]::Round(((Get-Date) - $startedAt).TotalSeconds, 1)
          $containers = @(
            'ecom-rental-backend-api-dev',
            'ecom-rental-backend-worker-dev',
            'ecom-rental-postgres-dev',
            'ecom-rental-backend-cloudflared-dev'
          )
          $existingContainers = @()
          foreach ($c in $containers) {
            $exists = docker ps --filter "name=^/$c$" --format '{{.Names}}'
            if ($exists) { $existingContainers += $c }
          }
          $statsLines = ''
          if ($existingContainers.Count -gt 0) {
            $statsLines = docker stats --no-stream --format "| ${bt}{{.Name}}${bt} | {{.CPUPerc}} | {{.MemUsage}} |" @existingContainers
          }

          $summary = @(
            "## Dev Backend Auto-Deployment Summary",
            "",
            "| Property | Value |",
            "| :--- | :--- |",
            "| **Environment** | ${bt}dev${bt} (Active) |",
            "| **Live API Base URL** | [$env:DEV_PUBLIC_URL]($env:DEV_PUBLIC_URL) |",
            "| **Health Check** | [$env:DEV_PUBLIC_URL/api/v1/health]($env:DEV_PUBLIC_URL/api/v1/health) (${bt}200 OK${bt}) |",
            "| **Deployed Commit** | ${bt}$commitSha${bt} - $commitMsg *(by $commitAuthor)* |",
            "| **Deploy Duration** | ${durationSec}s |",
            "",
            "### Active Dev Backend Containers",
            "| Container | CPU | Memory Usage |",
            "| :--- | :--- | :--- |",
            $statsLines
          ) -join "`n"

          [System.IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "$summary`n", [System.Text.UTF8Encoding]::new($false))

      - name: Update GitHub Deployment Status (Success)
        if: success() && steps.gh_deploy.outputs.deployment_id != ''
        shell: powershell
        env:
          DEPLOYMENT_ID: ${{ steps.gh_deploy.outputs.deployment_id }}
        run: |
          try {
            $headers = @{
              'Authorization'        = "Bearer $env:GH_TOKEN"
              'Accept'               = 'application/vnd.github+json'
              'X-GitHub-Api-Version' = '2022-11-28'
              'User-Agent'           = 'GitHub-Actions-Dev-Deploy'
            }
            $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            $body = @{
              state           = 'success'
              environment     = 'dev'
              environment_url = "$env:DEV_PUBLIC_URL/api/v1/health"
              log_url         = $runUrl
              description     = 'Dev Backend API and Worker are live'
            } | ConvertTo-Json
            Invoke-RestMethod -Method Post `
              -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/deployments/$env:DEPLOYMENT_ID/statuses" `
              -Headers $headers -Body $body -ContentType 'application/json' | Out-Null
          } catch {
            Write-Warning "Could not update GitHub Deployment status: $($_.Exception.Message)"
          }

      - name: Update GitHub Deployment Status (Failure)
        if: failure() && steps.gh_deploy.outputs.deployment_id != ''
        shell: powershell
        env:
          DEPLOYMENT_ID: ${{ steps.gh_deploy.outputs.deployment_id }}
        run: |
          try {
            $headers = @{
              'Authorization'        = "Bearer $env:GH_TOKEN"
              'Accept'               = 'application/vnd.github+json'
              'X-GitHub-Api-Version' = '2022-11-28'
              'User-Agent'           = 'GitHub-Actions-Dev-Deploy'
            }
            $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            $body = @{
              state       = 'failure'
              environment = 'dev'
              log_url     = $runUrl
              description = 'Dev Backend deployment failed'
            } | ConvertTo-Json
            Invoke-RestMethod -Method Post `
              -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/deployments/$env:DEPLOYMENT_ID/statuses" `
              -Headers $headers -Body $body -ContentType 'application/json' | Out-Null
          } catch {
            Write-Warning "Could not update GitHub Deployment failure status: $($_.Exception.Message)"
          }

  sync-uat:
    name: Auto-Merge dev -> uat (No UAT Deploy)
    needs: deploy-dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout full git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge dev into uat branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin dev uat
          git checkout -B uat origin/uat
          git merge origin/dev --no-edit -m "chore(uat): auto-sync verified changes from dev"
          git push origin uat
